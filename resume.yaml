basics:
  name: Christian Dannie Storgaard
  label: Full-stack Developer / Technical Team Lead
  summary: >-
    Developing websites since 1995, I’ve used JavaScript since its inception and have worked on front-end, back-end, desktop, mobile, and the DevOps side of things.
    I tend to find improvements to the experience of both users and developers and ways of optimising processes within the code and my work environment. I’m passionate about open communication and cooperating as a team.
  # From my LinkedIn profile:
  # summary: >-
  #   I've been building websites, apps and games since 1995, going from AmigaOS through Windows and settling in permanently with Linux in 2000.

  #   With experience in desktop, web, server, mobile (Android / iOS) and a bit of audio and game development, I'm very much a "full-stack" developer.

  #   I've built back-ends for tens of thousands of users, presentation apps and sites for much fewer and always try to hit the right balance between engineering complexity and the product's needs. Sometimes that means a cluster of services and a full-fat client, other times, it's a microserver with a front-end that could run on your toaster.

  #   Over the course of my career, I've successfully helped - as a developer, team lead or consultant - develop web, mobile and server applications for multiple sectors, including Medtech, Retailtech, E-commerce, EdTech and maritime tech.

  #   When I'm not coding things or messing around with Linux in some capacity, you'll find me tinkering on that same old Amiga that got me started on programming.

  personalSummary: >-
    I’m originally from **Copenhagen, Denmark**, but I’m currently in **Greece**. Here, **Nix** and my **dockerised NAS** is slowly taking over my other computers, and I wish I had more **Raspberry Pis**.
    When I’m not in front of my main computer, I feed my growing **film collection** (don’t get me started on trivia), fiddle with my good ol’ **Commodore Amiga** (also don’t get me started on trivia), make a bit of **music**, or plan **costumes** for the next Halloween.
  ATSsummary: >-
    Technical Team Lead and Senior Full‑stack Engineer with 20+ years of experience shipping products across FE / BE / DevOps as well as building, leading, and mentoring teams. I specialise in broad domain knowledge, legacy modernisation, reproducible tooling and environments, and CI/CD that boost release frequency and reliability.
  ATSsummary.da: >-
    Jeg har over 20 års erfaring med web-udvikling, og flere års erfaring i at opløfte og lede udviklingshold over en bred vifte af domæner, fra front-end og back-end til DevOps. Især har jeg et fokus på generel forbedring af udviklings-metodologier, modernisering af ældre kode, reproducerbare værktøjskæder, og optimering af systemer og bruger-interaktion.
  ATScommonstacks:
    - TypeScript / Node.js / React / Svelte
    - PostgreSQL
    - Docker
    - Nix
    - AWS / Azure / GCP
  # - "Signature wins: cut deploys from >3h to <30m at Contractbook; reduced PoC cycles from weeks to hours via custom multi-modal MCP-style Generative UI platform; migrated 250k+ LOC to modern TypeScript / Svelte in 3 weeks; led and mentored teams of 5–7 engineers."
  # - Consistently reduced deployment and development friction, improved codebase stability through testing and documentation, and mentored junior developers to mid / senior levels.
  # - "Domains: logistics, healthcare, fintech / trading, SaaS. Stacks: TypeScript / React / Svelte / Node.js, PostgreSQL, Docker, Nix, AWS / Azure / GCP."


