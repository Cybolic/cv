basics:
  name: Christian Dannie Storgaard
  label: Full-stack Developer / Technical Team Lead
  summary: >-
    Developing websites since 1995, I’ve used JavaScript since its inception and have worked on front-end, back-end, desktop, mobile, and the DevOps side of things.
    I tend to find improvements to the experience of both users and developers and ways of optimising processes within the code and my work environment. I’m passionate about open communication and cooperating as a team.
  personalSummary: >-
    I’m originally from **Copenhagen, Denmark**, but I’m currently in **Greece**. Here, **Nix** and my **dockerised NAS** is slowly taking over my other computers, and I wish I had more **Raspberry PIs**.
    When I’m not in front of my main computer, I feed my growing **film collection** (don’t get me started on trivia), fiddle with my good ol’ **Commodore Amiga** (also don’t get me started on trivia), make a bit of **music**, or plan **costumes** for the next Halloween.
  ATSsummary:
    - Full-stack Technical Lead with 10+ years leading engineering teams and 20+ years shipping web products across FE/BE/DevOps. Specialized in rapid legacy system modernization, reproducible tooling (Nix), and CI/CD automation that accelerates delivery.  
    - Built LLM-enabled products including multi-modal interfaces (Generative UI) and medical assistance tools, architected resilient APIs and data pipelines, and established developer experience standards across distributed teams. 
    - Consistently reduced deployment friction, improved codebase stability through testing and documentation, and mentored junior developers into productive mid-level contributors. 
    - "Target roles: Senior/Staff Software Engineer, Technical Lead, Team Lead, or Engineering Manager (hands-on)."

